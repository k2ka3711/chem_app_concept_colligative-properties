<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--@ARTIFACT-START-->
<title>希薄溶液の性質</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
@font-face {
  font-family: "TeX Gyre Schola";
  font-style: italic;
  font-weight: 400;
  src: url(data:font/ttf;base64,@SCHOLA_B64@) format("truetype");
}
/* Layout: 1画面 = 1つの実験台。左（スマホでは上）に図、右（スマホでは下）に「やること」。
   操作ボタンはすべて「やること」の中にあり、上から順に進めれば迷わない。下のバーで前後のステップへ。 */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --ink: #1d2a35;
  --muted: #5b6977;
  --line: #d4dde4;
  --accent: #2a6cb0;
  --accent-soft: #e4eef8;
  --water: #2f6db5;
  --solute: #c27c1e;
  --solute-soft: #fbefdc;
  --ice: #1d4f8a;
  --ice-fill: #d6e5f5;
  --liq: #e8f1fb;
  --gas: #fbfdff;
  --warm: #d26a12;
  --warm-soft: #fbeee1;
  --teal: #157c8b;
  --ok: #23905a;
  --ok-soft: #e1f3e9;
  --ng: #c0392b;
  --ng-soft: #fbe7e4;
  --f-body: "BIZ UDPGothic", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  --f-disp: "Zen Kaku Gothic New", "BIZ UDPGothic", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-num: "Times New Roman", "Liberation Serif", "TeX Gyre Termes", serif;
  --f-var: "TeX Gyre Schola", "Century Schoolbook", "Times New Roman", serif;
  --f-chem: Arial, "Liberation Sans", Helvetica, sans-serif;
  --rail-h: 56px;
  --bar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #19222b; --ink: #e3e9ee; --muted: #9babb8; --line: #2b3844;
    --accent: #6fa9ec; --accent-soft: #1b2b3d; --water: #6fa9ec; --solute: #e3a24f; --solute-soft: #33261a;
    --ice: #9cc4f0; --ice-fill: #1e3349; --liq: #172736; --gas: #141c24;
    --warm: #f2a256; --warm-soft: #33261a; --teal: #4cc0cf; --ok: #5fcb8e; --ok-soft: #183126; --ng: #ef7a6b; --ng-soft: #3a1f1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19222b; --ink: #e3e9ee; --muted: #9babb8; --line: #2b3844;
  --accent: #6fa9ec; --accent-soft: #1b2b3d; --water: #6fa9ec; --solute: #e3a24f; --solute-soft: #33261a;
  --ice: #9cc4f0; --ice-fill: #1e3349; --liq: #172736; --gas: #141c24;
  --warm: #f2a256; --warm-soft: #33261a; --teal: #4cc0cf; --ok: #5fcb8e; --ok-soft: #183126; --ng: #ef7a6b; --ng-soft: #3a1f1c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.7;
  padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
h2, h3, h4 { margin: 0; }

/* 組版：数値・単位（Times）、物理量（Schola 斜体）、化学式（Arial） */
.n { font-family: var(--f-num); }
.v { font-family: var(--f-var); font-style: italic; }
.chem { font-family: var(--f-chem); }
.op { font-family: var(--f-num); padding: 0 0.18em; }
sup, sub { font-size: 70%; line-height: 0; position: relative; vertical-align: baseline; }
sup { top: -0.51em; }
sub { bottom: -0.21em; }
.eq { white-space: nowrap; }

/* ---------- 上のバー（ステップの一覧） ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.rail-in {
  max-width: 1160px; margin: 0 auto; min-height: var(--rail-h);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 14px;
}
.brand { font-family: var(--f-disp); font-weight: 700; font-size: 18px; white-space: nowrap; }
.brand b { color: var(--accent); }
.steps { display: flex; gap: 4px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.steps button {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 3px 12px 3px 4px; white-space: nowrap; font-size: 14px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
}
.steps button .k {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  background: var(--bg); font-family: var(--f-num); font-size: 15px; color: var(--muted);
}
.steps button:hover { border-color: var(--accent); }
.steps button[aria-current="step"] { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); font-weight: 700; }
.steps button[aria-current="step"] .k { background: var(--accent); color: var(--surface); }
.steps button.done .k { background: var(--ok); color: var(--surface); font-family: var(--f-body); font-size: 14px; }
.help-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px;
  font-size: 14px; white-space: nowrap; min-height: 36px;
}
.help-btn:hover { border-color: var(--accent); }
@media (max-width: 900px) {
  .brand { display: none; }
  .steps button { padding-right: 4px; }
  .steps button .t { display: none; }
  .steps button[aria-current="step"] { padding-right: 12px; }
  .steps button[aria-current="step"] .t { display: inline; }
}

/* ---------- 本体 ---------- */
main {
  max-width: 1160px; margin: 0 auto;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.step { display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 13px; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.eyebrow .n { font-size: 15px; }
h2 { font-family: var(--f-disp); font-weight: 700; font-size: clamp(22px, 3.6vw, 32px); line-height: 1.35; text-wrap: balance; word-break: auto-phrase; }
.lead { color: var(--muted); max-width: 48em; }

/* 実験台：図（viz）＋ 読み取り（out）＋ やること（todo） */
.bench {
  display: grid; gap: 16px 20px; align-items: start;
  grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr);
  grid-template-areas: "viz todo" "out todo";
  grid-template-rows: auto 1fr;
}
.viz { grid-area: viz; }
.out { grid-area: out; display: flex; flex-direction: column; gap: 12px; }
.todo { grid-area: todo; position: sticky; top: calc(var(--rail-h) + 16px); }
@media (max-width: 860px) {
  .bench { grid-template-columns: minmax(0, 1fr); grid-template-areas: "viz" "todo" "out"; grid-template-rows: auto; }
  .todo { position: static; }
  /* スマホ：図を上に止めておき、下の「やること」を操作しながら図を見られるようにする */
  .viz { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--rail-h)); z-index: 5; background: var(--bg); padding-block: 6px; margin-block: -6px; }
}
@media (max-width: 860px) and (max-height: 620px) { .viz { position: static; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fig { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fig-label { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; line-height: 1.4; min-height: 1.4em; }
.tag-a, .tag-b {
  display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; flex: none;
  font-family: var(--f-chem); font-size: 14px; font-weight: 700; color: var(--surface);
}
.tag-a { background: var(--water); }
.tag-b { background: var(--solute); }
.cv-wrap { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.cv-wrap canvas { display: block; width: 100%; height: auto; }
.ov { position: absolute; font-size: 12px; line-height: 1.3; color: var(--muted); pointer-events: none; white-space: nowrap; }
.ov.strong { color: var(--ink); font-weight: 700; }
.ov.box { color: var(--ink); background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12px; }
.ov.box .n { font-size: 15px; font-weight: 700; }
.ov .fz { color: var(--accent); font-weight: 700; } .ov .mt { color: var(--warm); font-weight: 700; }
.fig .cv-wrap { margin-top: auto; }
.viz-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg-w { width: 10px; height: 10px; border-radius: 50%; background: var(--water); }
.lg-s { width: 13px; height: 12px; background: var(--solute); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.lg-i { width: 10px; height: 10px; border-radius: 50%; background: var(--ice); box-shadow: 0 0 0 2px var(--ice-fill); }
.lg-m { width: 4px; height: 13px; border-radius: 2px; background: var(--ng); }
.small-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 2px 10px; font-size: 13px; color: var(--muted); min-height: 32px; }
.small-btn:hover { border-color: var(--accent); color: var(--ink); }

/* いま起きていること */
.now {
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 15px;
}
.now .ic { font-weight: 700; color: var(--accent); white-space: nowrap; font-size: 13px; padding-top: 2px; }
.now b { color: var(--ink); }

/* メーター */
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meter-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.meter-title { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.meter-title .state { margin-left: auto; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 0 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.state.eq { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.state.up { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.state.down { color: var(--warm); border-color: var(--warm); background: var(--warm-soft); }
.bar-row { display: grid; grid-template-columns: 4.6em 1fr 2.6em; gap: 8px; align-items: center; font-size: 13px; }
.bar-row .lab { color: var(--muted); white-space: nowrap; }
.bar-row .val { text-align: right; font-family: var(--f-num); font-size: 15px; }
.bar { height: 12px; background: var(--bg); border-radius: 6px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width 0.25s linear; }
.bar i.c-evap, .bar i.c-melt { background: var(--warm); }
.bar i.c-cond, .bar i.c-freeze { background: var(--accent); }
.bar i.c-fwd { background: var(--teal); }
.bar i.c-rev { background: var(--accent); }
.bar i.c-push { background: var(--warm); }
.bar i.c-ice { background: var(--ice); }
.big-num { font-family: var(--f-num); font-size: 30px; line-height: 1.1; }
.unit-j { font-size: 14px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }

.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.chart-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 700; }
.chart-head .legend { font-weight: 400; }
.ln-a, .ln-b { width: 18px; height: 3px; border-radius: 2px; }
.ln-a { background: var(--water); }
.ln-b { background: var(--solute); }
.chart-wrap { position: relative; }
.chart-wrap canvas { display: block; width: 100%; height: auto; }

/* ---------- やること ---------- */
.todo {
  background: var(--surface); border: 2px solid var(--accent); border-radius: 14px;
  padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 10px;
}
.todo-head { display: flex; align-items: center; gap: 10px; }
.todo-head h3 { font-family: var(--f-disp); font-size: 20px; }
.todo-head .prog { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.todo-head .prog .n { font-size: 16px; color: var(--ink); }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.task { scroll-margin-top: calc(var(--rail-h) + 12px); scroll-margin-bottom: calc(var(--bar-h) + 12px); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; transition: opacity 0.2s; }
.task-head { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; }
.task-num {
  display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg); color: var(--muted); font-family: var(--f-num); font-size: 17px; font-weight: 700;
}
.task-text { padding-top: 3px; font-size: 15px; line-height: 1.6; }
.task-text .here {
  display: inline-block; font-size: 12px; font-weight: 700; color: var(--surface); background: var(--accent);
  border-radius: 4px; padding: 0 6px; margin-right: 6px; vertical-align: 1px;
}
.task-body { display: flex; flex-direction: column; gap: 8px; padding-left: 38px; }
.task[data-state="now"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.task[data-state="now"] .task-num { background: var(--accent); color: var(--surface); }
.task[data-state="done"] .task-num { background: var(--ok); color: var(--surface); font-family: var(--f-body); font-size: 15px; }
.task[data-state="later"] { opacity: 0.45; }
.task[data-state="later"] .task-body { display: none; }
.task:not([data-state="now"]) .here { display: none; }
@media (max-width: 860px) { .task-body { padding-left: 0; } }

/* ボタン類 */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px;
  min-height: 44px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: 0.5; cursor: default; }
.task[data-state="now"] .btn.primary:not(:disabled) { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent); } }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.choices { display: flex; flex-direction: column; gap: 6px; }
.choices.inline { flex-direction: row; flex-wrap: wrap; }
.choices button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px;
  min-height: 44px; text-align: left; line-height: 1.5;
}
.choices.inline button { text-align: center; flex: 1 1 auto; }
.choices button:hover:not(:disabled) { border-color: var(--accent); }
.choices button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; box-shadow: 0 0 0 1px var(--accent); }
.choices button.right { border-color: var(--ok); background: var(--ok-soft); font-weight: 700; box-shadow: 0 0 0 1px var(--ok); }
.choices button.wrong { border-color: var(--ng); background: var(--ng-soft); }
.fb { font-size: 14px; line-height: 1.6; }
.fb.ok { color: var(--ok); font-weight: 700; }
.fb.ng { color: var(--ng); }
.fb.info { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; min-height: 42px; border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
.seg-label { font-size: 13px; color: var(--muted); }
.progress { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s linear; }
.reading { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.reading .big-num { font-size: 26px; }
.reading.ok .big-num { color: var(--ok); }

/* スライダー（＋−ボタンつき） */
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.slider-top .big-num { font-size: 26px; }
.slider-row { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.slider-row .pm { min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-family: var(--f-num); font-size: 20px; padding: 0; }
.slider-row .pm:hover { border-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 32px; margin: 0; }
.scale { display: flex; justify-content: space-between; font-family: var(--f-num); font-size: 13px; color: var(--muted); padding-inline: 52px; }

/* ---------- まとめ ---------- */
.sum { scroll-margin-bottom: calc(var(--bar-h) + 12px); border: 2px solid var(--ok); border-radius: 14px; background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.sum h3 { font-family: var(--f-disp); font-size: 20px; color: var(--ok); display: flex; align-items: center; gap: 8px; }
.sum .pred { font-size: 14px; background: var(--bg); border-radius: 8px; padding: 6px 12px; }
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.flow li { position: relative; padding-left: 1.8em; }
.flow li::before { content: "↓"; position: absolute; left: 0; width: 1.4em; color: var(--muted); font-weight: 700; text-align: center; }
.flow li:first-child::before { content: "●"; font-size: 12px; }
.flow li:last-child { font-weight: 700; font-size: 17px; }
.formula { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; background: var(--bg); border-radius: 10px; padding: 12px 16px; }
.formula .main { font-size: 26px; font-family: var(--f-num); }
.formula .desc { font-size: 14px; color: var(--muted); line-height: 1.8; }
.formula .calc { flex-basis: 100%; font-size: 15px; }
.adv { border-top: 1px dashed var(--line); padding-top: 10px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.adv b { color: var(--ink); }
.adv .badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--warm); border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; margin-right: 6px; }

/* ---------- はじめに ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.phen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.phen button {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 4px; min-height: 100px;
}
.phen button:hover { border-color: var(--accent); }
.phen .pk { font-size: 13px; color: var(--muted); font-weight: 700; }
.phen .pn { font-family: var(--f-disp); font-weight: 700; font-size: 19px; }

    .replace(/\[([^\]]+)\]/g, (m, a) => `<span class="chem">${a.replace(/([A-Za-z)])(\d+)/g, "$1<sub>$2</sub>")}</span>`)

    el.width = Math.round(w * dpr); el.height = Math.round(w * H / W * dpr);

/* ================= 境目の拡大図（4場面で同じ形） ================= */
const Z = { x: 168, y: 8, w: 304, h: 264 }, BY = 140, R0 = 5;   // R0：速さ 1 のとき 1 秒に境目を通る数
function makeSim(key) {
  const inX = () => Z.x + 9 + rnd() * (Z.w - 18);
  const liq = [], top = [];
  for (let i = 0; i < 48; i++) liq.push({ x: inX(), y: BY + 10 + rnd() * (Z.y + Z.h - BY - 18), vx: 0, vy: 0, s: false });
  if (key === "vapor" || key === "boil") for (let i = 0; i < (key === "vapor" ? C.N0 : 44); i++) top.push(newGas(inX(), Z.y + 8 + rnd() * (BY - Z.y - 16)));

  if (key === "osmo") for (let i = 0; i < 48; i++) top.push({ x: inX(), y: Z.y + 8 + rnd() * (BY - Z.y - 18), vx: 0, vy: 0 });

function newGas(x, y, up) { const a = up ? -Math.PI / 2 + (rnd() - 0.5) * 2 : rnd() * 6.28; return { x, y, vx: 1.8 * Math.cos(a), vy: 1.8 * Math.sin(a) }; }
function brown(p, f, k, y0, y1) {
  p.vx = p.vx * 0.9 + (rnd() - 0.5) * 0.9 * k; p.vy = p.vy * 0.9 + (rnd() - 0.5) * 0.9 * k;
  p.x += p.vx * f; p.y += p.vy * f;
  if (p.x < Z.x + 6) { p.x = Z.x + 6; p.vx = Math.abs(p.vx); } if (p.x > Z.x + Z.w - 6) { p.x = Z.x + Z.w - 6; p.vx = -Math.abs(p.vx); }
  if (p.y < y0) { p.y = y0; p.vy = Math.abs(p.vy); } if (p.y > y1) { p.y = y1; p.vy = -Math.abs(p.vy); }
}
function simStep(sim, s, r, dt) {
  const f = Math.min(dt * 60, 3), key = sim.key, gas = key === "vapor" || key === "boil";
  const hot = key === "boil" ? 1.5 : key === "freeze" ? 0.7 : 1;
  for (const p of sim.liq) brown(p, f, (p.s ? 0.7 : 1) * hot, BY + 7, Z.y + Z.h - 7);
  if (gas) for (const p of sim.top) {
    p.x += p.vx * f; p.y += p.vy * f;
    if (p.x < Z.x + 5) { p.x = Z.x + 5; p.vx = Math.abs(p.vx); } if (p.x > Z.x + Z.w - 5) { p.x = Z.x + Z.w - 5; p.vx = -Math.abs(p.vx); }
    if (p.y < Z.y + 5) { p.y = Z.y + 5; p.vy = Math.abs(p.vy); } if (p.y > BY - 6) { p.y = BY - 6; p.vy = -Math.abs(p.vy); }
  }
  if (key === "osmo") for (const p of sim.top) brown(p, f, 1, Z.y + 7, BY - 8);

  sim.oc += R0 * Math.max(0, r.out) * dt; sim.ic += R0 * Math.max(0, r.in) * dt; sim.fc += R0 * (1 - xWater(s.mp)) * dt;
  while (sim.oc >= 1) {
    sim.oc -= 1;
    const cand = sim.liq.filter((p) => !p.s && p.y < BY + 40), p = cand[Math.floor(rnd() * cand.length)];
    const x = p ? p.x : Z.x + 20 + rnd() * (Z.w - 40);
    if (p) { p.y = BY + 50 + rnd() * 60; p.x = Z.x + 9 + rnd() * (Z.w - 18); }
    sim.fly.push({ d: 1, x, t: 0 });
  }
  while (sim.ic >= 1) {
    sim.ic -= 1;
    let x = Z.x + 20 + rnd() * (Z.w - 40);
    if (key === "vapor" && sim.top.length > Math.round(s.n)) { const g = sim.top.splice(Math.floor(rnd() * sim.top.length), 1)[0]; x = g.x; }
    if (key === "freeze") x = Z.x + 9 + Math.floor(rnd() * 15) * 20.5;

/* ---------- 左の全体図 ---------- */
const DOTS = Array.from({ length: 12 }, () => [rnd(), rnd()]);
function vessel(ctx, y1, y2, yl, lid) {
  ctx.fillStyle = COL.liq; ctx.fillRect(34, yl, 90, y2 - yl);
  line(ctx, [[34, y1], [34, y2], [124, y2], [124, y1]], COL.muted, 2.5);
  if (lid) line(ctx, [[28, y1], [130, y1]], COL.muted, 5);

}
function soluteDots(ctx, x0, y0, w, h, n) { for (let i = 0; i < n; i++) hexagon(ctx, x0 + 6 + DOTS[i][0] * (w - 12), y0 + 6 + DOTS[(i + 5) % 12][1] * (h - 12), 3.6); }
function drawMacro(ctx, key, s) {
  let mx = 79, my = 160;
  if (key === "vapor") {
    vessel(ctx, 86, 236, 166, true);
    const k = Math.round(s.n / C.N0 * 10 + 0.001);
    for (let i = 0; i < k; i++) circle(ctx, 42 + DOTS[i][0] * 74, 96 + DOTS[i][1] * 60, 2.6, COL.water);
    if (s.mp) soluteDots(ctx, 36, 170, 86, 62, 6);
    my = 166;
  } else if (key === "boil") {
    vessel(ctx, 84, 214, 112, false);
    if (s.mp) soluteDots(ctx, 36, 118, 86, 92, 6);
    const big = s.heat ? 1 : 0.55;
    for (const dx of [-16, 0, 16]) { ctx.beginPath(); ctx.moveTo(79 + dx - 7, 250); ctx.quadraticCurveTo(79 + dx, 250 - 30 * big, 79 + dx + 7, 250); ctx.fillStyle = COL.warm; ctx.fill(); }
    line(ctx, [[50, 252], [108, 252]], COL.muted, 3);
    if (s.boiling) for (let i = 0; i < 6; i++) { const u = (s.t * 0.9 + i / 6) % 1; circle(ctx, 46 + DOTS[i][0] * 66, 208 - u * 92, 3 + u * 4, COL.gas, COL.water, 1.3); }
    else if (s.mp) circle(ctx, 79, 196, 2.5 + Math.abs(Math.sin(s.t * 3)) * 2, COL.gas, COL.water, 1.2);
    mx = 79; my = 176;
    if (s.boiling) circle(ctx, mx, my, 8, COL.gas, COL.water, 1.3);
  } else if (key === "freeze") {
    vessel(ctx, 84, 236, 122, false);
    if (s.mp) soluteDots(ctx, 36, 150, 86, 82, 6);
    const h = 9 + s.ice * 0.3;
    ctx.beginPath(); ctx.roundRect(79 - h, 126 - h * 0.55, 2 * h, 1.45 * h, 5); ctx.fillStyle = COL["ice-fill"]; ctx.fill(); ctx.strokeStyle = COL.ice; ctx.lineWidth = 2; ctx.stroke();
    my = 126 + h * 0.9;
  } else {
    const yA = 138 + s.dh * 22, yB = 138 - s.dh * 22;
    ctx.fillStyle = COL.liq; ctx.fillRect(36, yA, 28, 235 - yA); ctx.fillRect(36, 205, 43, 30);
    ctx.fillStyle = s.mp ? COL["solute-soft"] : COL.liq; ctx.fillRect(94, yB, 28, 235 - yB); ctx.fillRect(79, 205, 43, 30);
    if (s.mp) { soluteDots(ctx, 94, Math.max(yB, 150), 28, 60, 4); soluteDots(ctx, 82, 206, 38, 28, 2); }
    line(ctx, [[36, 78], [36, 235], [122, 235], [122, 78]], COL.muted, 2.5);
    line(ctx, [[64, 78], [64, 205], [94, 205], [94, 78]], COL.muted, 2.5);
    line(ctx, [[36, yA], [64, yA]], COL.water, 1.5); line(ctx, [[94, yB], [122, yB]], COL.water, 1.5);
    line(ctx, [[79, 205], [79, 235]], COL.ng, 3.5, [5, 3]);
    if (s.showPiston) {
      ctx.fillStyle = COL.muted; ctx.fillRect(96, yB - 9, 24, 8); ctx.fillRect(106, yB - 34, 4, 26);
      if (s.P > 0.01) { const L = 8 + s.P * 9; line(ctx, [[108, yB - 40 - L], [108, yB - 40]], COL.warm, 3); ctx.beginPath(); ctx.moveTo(108, yB - 34); ctx.lineTo(102, yB - 43); ctx.lineTo(114, yB - 43); ctx.fillStyle = COL.warm; ctx.fill(); }
    }
    if (s.mp) line(ctx, [[30, 138], [128, 138]], COL.muted, 1, [3, 3]);
    my = 220;
  }
  // 拡大している場所
  circle(ctx, mx, my, 11, null, COL.accent, 2);
  line(ctx, [[mx + 8, my - 8], [Z.x, Z.y + 8]], COL.accent, 1, [4, 3]); line(ctx, [[mx + 8, my + 8], [Z.x, Z.y + Z.h - 8]], COL.accent, 1, [4, 3]);
}
